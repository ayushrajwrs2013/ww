<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WasteWise - Survey Data Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root, [data-theme="light"] {
      --primary: #2E7D32;
      --primary-light: #4CAF50;
      --bg: #F5F9F5;
      --white: #FFFFFF;
      --text: #1A1A2E;
      --text-light: #5C6B5C;
      --border: #e2ebe2;
    }
    [data-theme="dark"] {
      --primary: #4CAF50;
      --primary-light: #2E7D32;
      --bg: #0D1B0D;
      --white: #1A2E1A;
      --text: #E8F5E8;
      --text-light: #A5C9A5;
      --border: #2c422c;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .navbar { background: var(--white); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; }
    .navbar .logo { font-size: 20px; font-weight: 800; color: var(--primary); }
    .section { padding: 24px 20px; max-width: 1200px; margin: 0 auto; }
    .section-title { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .section-subtitle { font-size: 14px; color: var(--text-light); margin-bottom: 20px; }
    .panel { background: var(--white); border-radius: 20px; padding: 24px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .login-card { max-width: 420px; margin: 80px auto; text-align: center; }
    .lock-icon { width: 84px; height: 84px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 40px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .login-card h3 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .login-card p { font-size: 14px; color: var(--text-light); margin-bottom: 20px; }
    input[type="password"] { width: 100%; padding: 14px 16px; border: 2px solid var(--border); border-radius: 14px; font-size: 15px; color: var(--text); background: var(--bg); font-family: inherit; }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { padding: 12px 28px; border: none; border-radius: 14px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(46,125,50,0.3); }
    .btn.small { padding: 8px 16px; font-size: 13px; border-radius: 20px; }
    .btn.ghost { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .login-btn { width: 100%; margin-top: 14px; }
    .error-msg { color: #c62828; font-size: 13px; font-weight: 600; margin-top: 12px; display: none; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar .count { font-size: 15px; font-weight: 600; color: var(--text); }
    .toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); max-height: 78vh; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 800; position: sticky; top: 0; z-index: 1; }
    tbody tr:nth-child(even) { background: rgba(46,125,50,0.02); }
    td.wrap { white-space: normal; min-width: 180px; }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-light); font-size: 15px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">WasteWise — Data Viewer</div>
  </nav>

  <div class="section">
    <div id="loginView">
      <div class="panel login-card">
        <div class="lock-icon">&#128273;</div>
        <h3>Survey Data Viewer</h3>
        <p>Enter your admin key to view all collected survey responses.</p>
        <input type="password" id="keyInput" placeholder="Enter admin key" autocomplete="current-password">
        <button class="btn login-btn" id="loginBtn">View Data</button>
        <div class="error-msg" id="loginError"></div>
      </div>
    </div>

    <div id="view" hidden>
      <h2 class="section-title">Survey Response Data</h2>
      <p class="section-subtitle">Read-only view of all collected responses. Data updates live — refresh to see new submissions.</p>
      <div class="panel">
        <div class="toolbar">
          <span class="count" id="countLabel">Loading...</span>
          <div class="actions">
            <a class="btn small" id="csvBtn" href="#">Export as CSV</a>
            <button class="btn small ghost" id="refreshBtn">Refresh</button>
            <button class="btn small ghost" id="logoutBtn">Log out</button>
          </div>
        </div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table>
            <thead><tr id="thead"></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyLabel" hidden>No responses have been recorded yet.</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const FIELD_ORDER = ['Timestamp', 'Name', 'Age', 'Gender', 'Occupation', 'Town', 'Frequent Waste Types', 'Largest Waste', 'Segregate Waste', 'Food Waste Handling', 'Plastic Harms Aquatic Life', 'Useful Scientific Model', 'Other Details', 'Suggestion'];
    const WIDE = ['Frequent Waste Types', 'Other Details', 'Suggestion', 'Useful Scientific Model', 'Food Waste Handling'];
    const STORAGE_KEY = 'wastewise_viewer_key';

    let viewerKey = sessionStorage.getItem(STORAGE_KEY) || '';
    let lastRows = [];

    function login() {
      const input = document.getElementById('keyInput');
      const key = (input.value || '').trim();
      if (!key) return;
      load(key, true);
    }

    function logout() {
      viewerKey = '';
      sessionStorage.removeItem(STORAGE_KEY);
      document.getElementById('view').hidden = true;
      document.getElementById('loginView').hidden = false;
      document.getElementById('keyInput').value = '';
    }

    function load(key, fromLogin) {
      key = key || viewerKey;
      if (!key) return logout();
      wwFetchStats(key)
        .then(function (rows) {
          sessionStorage.setItem(STORAGE_KEY, key);
          viewerKey = key;
          document.getElementById('loginError').style.display = 'none';
          document.getElementById('loginView').hidden = true;
          document.getElementById('view').hidden = false;
          lastRows = rows || [];
          render(lastRows);
        })
        .catch(function (err) {
          sessionStorage.removeItem(STORAGE_KEY);
          viewerKey = '';
          document.getElementById('view').hidden = true;
          document.getElementById('loginView').hidden = false;
          const e = document.getElementById('loginError');
          e.textContent = err.message === 'unauthorized' ? 'Incorrect key. Try again.' : 'Could not load data. ' + err.message;
          e.style.display = 'block';
        });
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function render(rows) {
      document.getElementById('countLabel').textContent = rows.length + ' total response' + (rows.length === 1 ? '' : 's');
      document.getElementById('thead').innerHTML = FIELD_ORDER.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
      const empty = document.getElementById('emptyLabel');
      const wrap = document.getElementById('tableWrap');
      if (!rows.length) { wrap.hidden = true; empty.hidden = false; return; }
      empty.hidden = true;
      wrap.hidden = false;
      document.getElementById('tbody').innerHTML = rows.map(function (r) {
        return '<tr>' + FIELD_ORDER.map(function (h) {
          let v = r[h] || '';
          if (h === 'Timestamp' && v) {
            const d = new Date(v);
            if (!isNaN(d.getTime())) v = d.toLocaleString('en-IN');
          }
          const cls = WIDE.indexOf(h) !== -1 ? ' class="wrap"' : '';
          return '<td' + cls + '>' + esc(v) + '</td>';
        }).join('') + '</tr>';
      }).join('');
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('keyInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    document.getElementById('refreshBtn').addEventListener('click', function () { load(); });
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('csvBtn').addEventListener('click', function (e) {
      e.preventDefault();
      if (!lastRows.length) { alert('No responses to export yet.'); return; }
      wwDownload('wastewise-responses.csv', wwToCsv(lastRows, FIELD_ORDER));
    });

    if (viewerKey) load(viewerKey);
  </script>
  <script src="translate.js"></script>
</body>
</html>
