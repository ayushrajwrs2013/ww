<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WasteWise - Response Database</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root, [data-theme="light"] {
      --primary: #2E7D32;
      --primary-light: #4CAF50;
      --bg: #F5F9F5;
      --white: #FFFFFF;
      --text: #1A1A2E;
      --text-light: #5C6B5C;
      --border: #e2ebe2;
    }
    [data-theme="dark"] {
      --primary: #4CAF50;
      --primary-light: #2E7D32;
      --bg: #0D1B0D;
      --white: #1A2E1A;
      --text: #E8F5E8;
      --text-light: #A5C9A5;
      --border: #2c422c;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .navbar { background: var(--white); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 100; }
    .navbar .logo { font-size: 20px; font-weight: 800; color: var(--primary); }
    .navbar .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .navbar .nav-links a { text-decoration: none; color: var(--text); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 20px; transition: all 0.2s; }
    .navbar .nav-links a:hover, .navbar .nav-links a.active { background: var(--primary); color: var(--white); }
    .section { padding: 24px 20px; max-width: 1100px; margin: 0 auto; }
    .section-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .section-subtitle { font-size: 14px; color: var(--text-light); margin-bottom: 20px; }
    .panel { background: var(--white); border-radius: 20px; padding: 24px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .login-card { max-width: 400px; margin: 60px auto; text-align: center; }
    .lock-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    .login-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .login-card p { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
    input[type="password"], input[type="text"] { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px; font-size: 15px; color: var(--text); background: var(--bg); font-family: inherit; }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { padding: 12px 24px; border: none; border-radius: 14px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(46,125,50,0.3); }
    .btn.small { padding: 8px 16px; font-size: 13px; border-radius: 20px; }
    .btn.ghost { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn.danger { background: #e53935; }
    .login-btn { width: 100%; margin-top: 14px; }
    .error-msg { color: #c62828; font-size: 13px; font-weight: 600; margin-top: 12px; display: none; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar .count { font-size: 14px; color: var(--text-light); }
    .toolbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
    table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 700; position: sticky; top: 0; }
    tbody tr:hover { background: var(--bg); }
    td.wrap { white-space: normal; min-width: 180px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; background: var(--bg); font-size: 12px; font-weight: 600; color: var(--primary); }
    .empty { text-align: center; padding: 50px 20px; color: var(--text-light); font-size: 14px; }
    .row-actions button { border: none; background: transparent; color: #c62828; cursor: pointer; font-size: 12px; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">WasteWise Admin</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="survey.html">Survey</a>
      <a href="results.html">Results</a>
      <a href="admin.html" class="active">Database</a>
    </div>
  </nav>

  <div class="section">
    <div id="loginView">
      <div class="panel login-card">
        <div class="lock-icon">&#128274;</div>
        <h3>Admin access</h3>
        <p>Enter the admin key to view collected responses.</p>
        <input type="password" id="keyInput" placeholder="Admin key" autocomplete="current-password">
        <button class="btn login-btn" id="loginBtn">Unlock Database</button>
        <div class="error-msg" id="loginError"></div>
      </div>
    </div>

    <div id="dbView" hidden>
      <h2 class="section-title">Response Database</h2>
      <p class="section-subtitle">Every survey submission is stored in your SQLite database and listed below.</p>
      <div class="panel">
        <div class="toolbar">
          <span class="count" id="countLabel">Loading...</span>
          <div class="actions">
            <a class="btn small" id="csvBtn" href="#">Download CSV</a>
            <button class="btn small ghost" id="refreshBtn">Refresh</button>
            <button class="btn small ghost" id="logoutBtn">Lock</button>
          </div>
        </div>
        <div class="table-wrap" id="tableWrap" hidden>
          <table>
            <thead><tr id="thead"></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyLabel" hidden>No responses yet. Share your survey link to start collecting data.</div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const FIELD_ORDER = ['Timestamp', 'Name', 'Age', 'Gender', 'Occupation', 'Town', 'Frequent Waste Types', 'Largest Waste', 'Segregate Waste', 'Food Waste Handling', 'Plastic Harms Aquatic Life', 'Useful Scientific Model', 'Other Details', 'Suggestion'];
    const WIDE = ['Frequent Waste Types', 'Other Details', 'Suggestion', 'Useful Scientific Model', 'Food Waste Handling'];
    const STORAGE_KEY = 'wastewise_admin_key';

    let adminKey = sessionStorage.getItem(STORAGE_KEY) || '';
    let lastRows = [];

    function login() {
      const input = document.getElementById('keyInput');
      const key = (input.value || '').trim();
      if (!key) return;
      adminKey = key;
      loadResponses(key, true);
    }

    function logout() {
      adminKey = '';
      sessionStorage.removeItem(STORAGE_KEY);
      document.getElementById('dbView').hidden = true;
      document.getElementById('loginView').hidden = false;
      document.getElementById('keyInput').value = '';
    }

    function loadResponses(key, fromLogin) {
      key = key || adminKey;
      if (!key) return logout();
      wwFetchStats(key)
        .then(function (rows) {
          sessionStorage.setItem(STORAGE_KEY, key);
          adminKey = key;
          document.getElementById('loginError').style.display = 'none';
          document.getElementById('loginView').hidden = true;
          document.getElementById('dbView').hidden = false;
          lastRows = rows || [];
          render(lastRows);
        })
        .catch(function (err) {
          if (err.message === 'unauthorized') {
            sessionStorage.removeItem(STORAGE_KEY);
            adminKey = '';
            document.getElementById('dbView').hidden = true;
            document.getElementById('loginView').hidden = false;
            const e = document.getElementById('loginError');
            e.textContent = 'Wrong admin key. Try again.';
            e.style.display = 'block';
          } else {
            const e = document.getElementById('loginError');
            e.textContent = 'Could not load responses. ' + err.message;
            e.style.display = 'block';
          }
        });
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function render(rows) {
      document.getElementById('countLabel').textContent = rows.length + ' response' + (rows.length === 1 ? '' : 's') + ' collected';
      document.getElementById('thead').innerHTML = FIELD_ORDER.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '<th></th>';
      const empty = document.getElementById('emptyLabel');
      const wrap = document.getElementById('tableWrap');
      if (!rows.length) { wrap.hidden = true; empty.hidden = false; return; }
      empty.hidden = true;
      wrap.hidden = false;
      document.getElementById('tbody').innerHTML = rows.map(function (r) {
        const cells = FIELD_ORDER.map(function (h) {
          let v = r[h] || '';
          if (h === 'Timestamp' && v) {
            const d = new Date(v);
            if (!isNaN(d.getTime())) v = d.toLocaleString('en-IN');
          }
          const cls = WIDE.indexOf(h) !== -1 ? ' class="wrap"' : '';
          return '<td' + cls + '>' + esc(v) + '</td>';
        }).join('');
        return '<tr>' + cells + '<td class="row-actions"><button data-id="' + esc(r.id || '') + '">Delete</button></td></tr>';
      }).join('');
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('keyInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
    document.getElementById('refreshBtn').addEventListener('click', function () { loadResponses(); });
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('tbody').addEventListener('click', function (e) {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      if (!confirm('Delete this response permanently?')) return;
      wwDeleteResponse(adminKey, btn.dataset.id).then(function () { loadResponses(); });
    });

    document.getElementById('csvBtn').addEventListener('click', function (e) {
      e.preventDefault();
      if (!lastRows.length) { alert('No responses to export yet.'); return; }
      wwDownload('wastewise-responses.csv', wwToCsv(lastRows, FIELD_ORDER));
    });

    if (adminKey) loadResponses(adminKey);
  </script>
  <script src="translate.js"></script>
</body>
</html>
